<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circle Stream — Watch</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #080810;
      --card: #151522;
      --border: #26263A;
      --text: #FFFFFF;
      --muted: #A5A5B5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #121222 0%, var(--bg) 65%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 24px;
      text-align: center;
    }
    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.2px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .meta {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 22px;
    }
    .btn-primary {
      display: block;
      width: 100%;
      padding: 13px 18px;
      border-radius: 999px;
      background: var(--text);
      color: #000000;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 10px;
    }
    .btn-secondary {
      display: block;
      width: 100%;
      padding: 12px 18px;
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }
    .status {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">CIRCLE STREAM</div>
    <h1 id="media-title">Opening in Circle Stream</h1>
    <p class="meta" id="media-meta">Checking for the Circle Stream app on your device...</p>
    <a id="download-btn" class="btn-primary" href="https://github.com/Asrihad1/Circle-Stream/releases/latest/download/circlestream.apk">
      Download Latest Circle Stream APK
    </a>
    <a id="open-app-btn" class="btn-secondary" href="circlestream://watch">
      Open in Circle Stream App
    </a>
    <p class="status" id="status-text">If the app does not open automatically, the APK download will start shortly.</p>
  </main>

  <script>
    const APK_DOWNLOAD_URL = "https://github.com/Asrihad1/Circle-Stream/releases/latest/download/circlestream.apk";
    const GITHUB_PAGES_BASE = "https://asrihad1.github.io/Circle-Stream/watch/";

    (function () {
      const params = new URLSearchParams(window.location.search);
      const type = params.get("type") || "movie";
      const id = params.get("id") || "";
      const title = params.get("title") || "";
      const year = params.get("year") || "";

      const titleEl = document.getElementById("media-title");
      const metaEl = document.getElementById("media-meta");
      const downloadBtn = document.getElementById("download-btn");
      const openAppBtn = document.getElementById("open-app-btn");
      const statusEl = document.getElementById("status-text");

      downloadBtn.href = APK_DOWNLOAD_URL;

      if (title) {
        titleEl.textContent = year ? `${title} (${year})` : title;
        metaEl.textContent = type === "series" ? "Series on Circle Stream" : "Movie on Circle Stream";
      }

      const query = params.toString();
      const suffix = query ? `?${query}` : "";
      const customSchemeUri = `circlestream://watch${suffix}`;
      const intentUri =
        `intent://watch${suffix}#Intent;scheme=circlestream;package=com.circle.stream;` +
        `S.browser_fallback_url=${encodeURIComponent(GITHUB_PAGES_BASE + (query ? `?${query}` : ""))};end`;

      openAppBtn.href = customSchemeUri;

      // Attempt immediate deep-link launch on Android
      const isAndroid = /Android/i.test(navigator.userAgent);
      window.location.replace(isAndroid ? intentUri : customSchemeUri);

      // Fallback redirect to latest APK if app is not installed and page stays visible
      setTimeout(function () {
        if (!document.hidden) {
          statusEl.textContent = "Redirecting to the latest Circle Stream APK...";
          window.location.href = APK_DOWNLOAD_URL;
        }
      }, 1800);
    })();
  </script>
</body>
</html>
